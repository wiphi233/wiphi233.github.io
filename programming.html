<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WiPhi Blog</title>
    <link rel="stylesheet" href="style.css" />
    <style>
        #ide {
            position: fixed;
            display: flex;
            left: 180px;
            top: 50px;
            right: 50px;
            bottom: 100px;
            background-color: rgba(46, 59, 84, 0.8);
        }
    </style>
</head>
<body>
    <div id="menu-placeholder"></div>
    <script>
        fetch('./header.html')
            .then(response => response.text())
            .then(data => {
                document.getElementById('menu-placeholder').innerHTML = data;
            });
    </script>

    <div class="glass" id="ide">
        <h1 style="position: fixed; left: 50px; color: white">Online IDE</h1>

    </div>

    <link rel="stylesheet" href="style.css" />
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WiPhi Blog</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>

    <!-- ====== 左上角：个人信息模块 ====== -->
    <div class="card profile-card">
        <img src="head.png" alt="头像" class="avatar" />
        <h1 class="name">WiPhi</h1>
        <p class="bio">探索技术与创意的边界</p>
        <div class="status">
            <span class="status-label">✦ 运行状况</span>
            <span class="status-time" id="uptime">0 天 0 小时 0 分钟</span>
        </div>
    </div>

    <!-- ====== 左侧居中：菜单模块 ====== -->
    <nav class="card menu-card">
        <a href="#" class="menu-item">主页</a>
        <a href="#" class="menu-item">文章</a>
        <a href="#" class="menu-item">友链</a>
    </nav>

    <!-- ====== 装饰脚标 ====== -->
    <div class="footer-deco">
        <span>© 2026 WiPhi · 灵感即兴</span>
    </div>

    <script src="script.js"></script>
</body>
</html>

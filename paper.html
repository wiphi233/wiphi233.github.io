<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WiPhi Blog</title>
    <link rel="stylesheet" href="style.css" />

<script src="https://cdn.jsdelivr.net/npm/marked@11.1.1/marked.min.js"></script>
    
    <!-- MathJax 配置 -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']],
                processEscapes: true
            },
            options: {
                processHtmlClass: 'mathjax',
                ignoreHtmlClass: 'no-mathjax'
            }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js" async></script>
</head>

<body>
    <div id="menu-placeholder"></div>
    <script>
        fetch('./header.html')
            .then(response => response.text())
            .then(data => {
                document.getElementById('menu-placeholder').innerHTML = data;
            });
    </script>

    <div class="paper glass">
        <div>
            <div class="glass tag" style="display: flex; position: fixed; right: 50px;">
                <p>文章</p>
            </div>
            <p style="display: flex; position: fixed; right: 200px; top: 25px; color: rgba(0, 0, 0, 0.6);">发布时间： 未知</p>
        </div>
        <p class="paper-text" id="content">内容</p>
    </div>

    <script src="paper.js"></script>
    <script src="script.js"></script>
</body>

</html>
